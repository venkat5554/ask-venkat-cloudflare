<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Ask Venkat — AI portfolio assistant for Venkateswara Reddy Pochana."
  >

  <title>Ask Venkat</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

  <div class="app-shell">

    <header class="topbar">

      <div class="brand">

        <div class="avatar">
          V
        </div>

        <div>
          <h1>Ask Venkat</h1>
          <p>AI portfolio assistant</p>
        </div>

      </div>

      <button
        id="newChatBtn"
        class="secondary"
        type="button"
      >
        New chat
      </button>

    </header>


    <main class="chat-layout">

      <section
        id="welcome"
        class="welcome"
      >

        <div class="welcome-mark">
          V
        </div>

        <h2>
		  Want to know more about me or my work?
		  Let’s chat — just ask.

        </h2>

        <p>
          Ask about my experience, skills,
          education, data engineering,
          analytics, AI, or previous roles.
        </p>


        <div class="suggestions">

          <button class="suggestion">
            Tell me about your data engineering experience.
          </button>

          <button class="suggestion">
            What did you do at Amazon?
          </button>

          <button class="suggestion">
            What are your strongest technical skills?
          </button>

          <button class="suggestion">
            Why would you be a good fit for a data role?
          </button>

        </div>

      </section>


      <section
        id="messages"
        class="messages"
        aria-live="polite"
      ></section>

    </main>


    <footer class="composer-wrap">

      <form
        id="chatForm"
        class="composer"
      >

        <textarea
          id="messageInput"
          rows="1"
          maxlength="4000"
          placeholder="Ask Venkat about his professional profile..."
        ></textarea>


        <button
          id="sendBtn"
          class="send"
          type="submit"
        >
          ↑
        </button>

      </form>


      <p class="disclaimer">
        Ask Venkat is an AI representation of
        Venkat’s professional profile.
      </p>

    </footer>

  </div>


  <script src="/app.js"></script>

</body>

</html>
